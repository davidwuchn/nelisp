name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  smoke:
    # Phase 1 Week 1-2 smoke: byte-compile nelisp.el and run the ERT
    # smoke suite on 3 OSes x 2 Emacs versions.  Expands as reader /
    # evaluator modules land in Week 3+.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        emacs-version: ['29.4', '30.1']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Emacs (Linux / macOS)
        if: runner.os != 'Windows'
        uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs-version }}

      - name: Set up Emacs (Windows)
        if: runner.os == 'Windows'
        uses: jcs090218/setup-emacs-windows@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Byte-compile
        shell: bash
        run: make compile
      - name: "Unsafe-surface inventory (Doc 170 sec 4.3 baseline gate)"
        shell: bash
        run: make unsafe-inventory

      # Placed before the ERT suite so a pre-existing test failure does
      # not skip the Mach-O toolchain-acceptance signal.
      - name: Mach-O acceptance (NeLisp-emitted arm64 exec + MH_OBJECT vs codesign/clang/ld64; macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: make macho-acceptance-test

      - name: Run smoke tests
        shell: bash
        run: make test
      - name: Standalone NeLisp eval (pure-elisp AOT, zero Rust; x86_64 Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: make standalone-eval-test
      - name: Standalone NeLisp reader->eval (text -> AOT reader, zero Rust; x86_64 Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: make standalone-reader-test
      - name: Standalone NeLisp SELF-HOST (interpreter compiles recursive fact -> native ELF, zero emacs; x86_64 Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: make standalone-selfhost-test
      - name: Standalone NeLisp MULTI-THREADED self-host (clone(2)+atomics, 3 parallel threads, zero emacs; x86_64 Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: make standalone-selfhost-mt-test
      - name: Standalone NeLisp PARALLEL BUILD (4 units compiled concurrently via fork(2), zero emacs; x86_64 Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: make standalone-parallel-compile-test
      - name: "Doc 171 G4 native TCO benchmark (TCO-rewritten defun vs hand-written nl-loop, floor 0.95x; Linux is the only lane with the cc + objcopy native-exec toolchain)"
        if: runner.os == 'Linux'
        shell: bash
        run: make bench-aot-tco
      - name: "Standalone NeLisp CHECKED allocator smoke (Doc 170 Stage 2 redzone/generation/leak report; Windows x86_64 -- the only standalone target with a runtime env probe, which NELISP_ALLOC_CHECK=1 arming needs)"
        if: runner.os == 'Windows'
        shell: bash
        run: make standalone-reader-checked NELISP_STANDALONE_TARGET=windows-x86_64

